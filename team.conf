# Team config, read by every script in scripts/. Plain shell: KEY="value", no spaces around "=".
# People, roles and branches for humans live in progress.md -> "Who owns what"; this file only holds what scripts need.

PROJECT_NAME="Sonic Assist"
TEAM_NAME="Team Sonic"
EVENT_NAME="DurHack 2026"

# The branch that carries the shared docs (CLAUDE.md, PROJECT.md, briefs, skills). Delete it before the repo goes public.
CONTEXT_BRANCH="context"

# Builder keys: short lowercase names. Each one gets builder-file-<key>.md and sets `git config team.builder <key>`.
BUILDERS="ahmed max laura salman"

# Who may publish every shared doc. Everyone else may publish research/ and their own brief. This guards against
# accidents, not against a teammate who edits this file on purpose.
DOCS_OWNERS="ahmed max"
