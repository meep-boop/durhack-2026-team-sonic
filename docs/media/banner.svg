<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Sonic Assist: step-by-step AR guidance from a remote expert. DurHack 2026, Team Sonic.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b1a"/>
      <stop offset="0.55" stop-color="#1a1240"/>
      <stop offset="1" stop-color="#2e1a6e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>

  <!-- a phone with an AR ring over a screw: the product in one picture -->
  <g transform="translate(940 46)">
    <rect x="0" y="0" width="150" height="268" rx="26" fill="#0f0f22" stroke="#a78bfa" stroke-width="3"/>
    <rect x="58" y="12" width="34" height="9" rx="4.5" fill="#26264a"/>
    <rect x="14" y="34" width="122" height="150" rx="10" fill="#1d1d3a"/>
    <circle cx="75" cy="108" r="26" fill="none" stroke="#ffffff" stroke-width="5"/>
    <circle cx="75" cy="108" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="75" cy="108" r="6" fill="#8b5cf6"/>
    <path d="M104 74 a40 40 0 0 1 10 22" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
    <path d="M110 92 l5 8 l4 -9" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="14" y="196" width="122" height="22" rx="6" fill="#26264a"/>
    <rect x="22" y="203" width="70" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="14" y="226" width="122" height="28" rx="14" fill="#8b5cf6"/>
    <text x="75" y="245" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Done, next step</text>
  </g>
  <g fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.8">
    <path d="M1090 150 C 1160 150, 1180 110, 1220 100"/>
  </g>
  <g transform="translate(1196 70)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#1d1d3a" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="28" cy="22" r="8" fill="#c4b5fd"/>
    <path d="M14 46 c3 -10 25 -10 28 0" fill="#c4b5fd"/>
  </g>

  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="64" y="56" width="300" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="214" y="80" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.5" fill="#ddd6fe">DURHACK 2026 · TEAM SONIC</text>
    <text x="62" y="176" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">Sonic Assist</text>
    <text x="64" y="230" font-size="27" font-weight="500" fill="#e9e5ff">A remote expert guides your hands, live, in AR.</text>
    <text x="64" y="272" font-size="21" fill="#b9b3d9">iPhone AR · live video call · 3D scan of the room · a camera rig that checks the work</text>
  </g>
</svg>
