<!doctype html>
<!--
  The README's hero image. Re-render both themes (the scan crop is laptop-scan.png, from viewer.html?splat=scan-0801.usdz):
  for t in light dark; do "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=2 --window-size=1200,420 --screenshot=hero-$t.png "file://$PWD/hero.html?theme=$t"; done
  then convert each to ../hero-$t.jpg.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sonic Assist hero</title>
<style>
  :root {
    --page: #ffffff; --ink: #1f2328; --muted: #59636e; --frame-edge: #d1d9e0;
    /* The app's one accent (ios/RemoteAssist/UI/Theme.swift), used only where the app uses it: the chip's badge. */
    --accent: #8b5cf6;
  }
  :root[data-theme="dark"] { --page: #0d1117; --ink: #f0f6fc; --muted: #9198a1; --frame-edge: #3d444d; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 420px; overflow: hidden; background: var(--page); }
  body {
    display: grid; grid-template-columns: 1fr 680px; align-items: center; gap: 48px; padding: 40px 40px 40px 64px;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 72px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .tagline { margin-top: 20px; font-size: 26px; line-height: 1.3; font-weight: 400; max-width: 400px; }
  .meta { margin-top: 28px; font-size: 18px; color: var(--muted); }

  /* The phone's camera view: dark in both themes, because it's a camera, not a page. */
  .view {
    position: relative; width: 680px; height: 340px; border-radius: 22px; overflow: hidden;
    background: #10121a url(laptop-scan.png) center / cover no-repeat; outline: 1px solid var(--frame-edge);
  }
  .live {
    position: absolute; top: 16px; left: 16px; display: flex; align-items: center; gap: 8px;
    padding: 7px 14px 7px 12px; border-radius: 999px; background: rgba(0, 0, 0, 0.62);
    color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 0.04em;
  }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: #ff3b30; }
  .live span { font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  svg.marks { position: absolute; inset: 0; }
  /* Shapes.chip in the app: a white plate, dark text, a round coloured badge. */
  .chip {
    position: absolute; left: 177px; top: 92px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
    padding: 5px 14px 5px 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.93); white-space: nowrap;
    color: #141414; font-size: 15px; font-weight: 600;
  }
  .chip b {
    display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 13px; font-weight: 800;
  }
</style>
</head>
<body>
  <div>
    <h1>Sonic Assist</h1>
    <p class="tagline">A remote expert guides your hands, live, in AR.</p>
    <p class="meta">Built at DurHack 2026 by Team Sonic</p>
  </div>
  <div class="view" role="img" aria-label="Our laptop's scanned underside, seen through the phone, with the app's AR mark on a screw">
    <div class="live"><i></i>LIVE <span>0:47</span></div>
    <!-- The pin sits on a real screw hole in the scan (372, 398 in laptop-scan.png, scaled to this frame). -->
    <svg class="marks" viewBox="0 0 680 340" aria-hidden="true">
      <line x1="177" y1="124" x2="177" y2="170" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="177" cy="189" r="28" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="177" cy="189" r="15" fill="none" stroke="#fff" stroke-width="3.5"/>
      <circle cx="177" cy="189" r="3.5" fill="#fff"/>
      <!-- Unscrew: the app's turn cue goes anticlockwise round the screw. -->
      <path d="M 208 176 A 34 34 0 1 0 211 199" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 202 170 L 209 176 L 200 181" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="chip"><b>1</b>Cover screw</div>
  </div>
  <script>
    document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
  </script>
</body>
</html>
