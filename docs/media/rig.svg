<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Drawing of our rig: a Nicla Vision camera looks down at the open laptop's SSD bay, sends what it sees over USB to an Arduino UNO Q, which tells the relay over Wi-Fi; the console and the phone show a tick or a cross.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b1a"/>
      <stop offset="1" stop-color="#1e1650"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <text x="32" y="44" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#a78bfa">OUR RIG: UNO Q + NICLA VISION</text>

  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#e9e5ff">
    <!-- the open laptop, from above, with the SSD bay -->
    <g transform="translate(60 136)">
      <rect x="0" y="40" width="300" height="190" rx="14" fill="#2a2a44" stroke="#5b5b85" stroke-width="2"/>
      <rect x="22" y="62" width="256" height="146" rx="8" fill="#1b1b30"/>
      <g stroke="#3d3d60" stroke-width="2">
        <line x1="40" y1="90" x2="140" y2="90"/><line x1="40" y1="110" x2="140" y2="110"/>
        <line x1="40" y1="130" x2="140" y2="130"/><line x1="40" y1="150" x2="140" y2="150"/>
        <line x1="40" y1="170" x2="140" y2="170"/>
      </g>
      <rect x="160" y="110" width="104" height="52" rx="6" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 6"/>
      <rect x="170" y="120" width="84" height="32" rx="4" fill="#4b5563"/>
      <circle cx="240" cy="136" r="9" fill="#f472b6"/>
      <text x="212" y="190" text-anchor="middle" font-size="14" fill="#fcd34d">SSD bay</text>
      <text x="150" y="262" text-anchor="middle" font-size="16" font-weight="600">Open laptop, SSD with a bright sticker</text>
    </g>

    <!-- the Nicla Vision on a stand, looking down -->
    <g transform="translate(250 100)">
      <rect x="0" y="0" width="70" height="44" rx="8" fill="#0f766e" stroke="#5eead4" stroke-width="2"/>
      <circle cx="35" cy="34" r="9" fill="#0b0b1a" stroke="#5eead4" stroke-width="2"/>
      <text x="35" y="-10" text-anchor="middle" font-size="16" font-weight="700">Nicla Vision</text>
      <path d="M22 44 L-10 140 M48 44 L60 140" stroke="#5eead4" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 6" fill="none"/>
    </g>

    <!-- USB to the UNO Q -->
    <path d="M320 122 C 420 122, 430 200, 470 214" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="392" y="110" font-size="14" fill="#c4b5fd">USB: "seen=ssd-bay"</text>
    <g transform="translate(476 168)">
      <rect x="0" y="0" width="170" height="104" rx="12" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
      <text x="85" y="36" text-anchor="middle" font-size="18" font-weight="700">Arduino UNO Q</text>
      <text x="85" y="60" text-anchor="middle" font-size="13" fill="#bbf7d0">compares with the step:</text>
      <text x="85" y="80" text-anchor="middle" font-size="13" fill="#bbf7d0">step 3 out · step 4 in</text>
    </g>

    <!-- Wi-Fi to the relay -->
    <path d="M646 220 L 744 220" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="695" y="206" text-anchor="middle" font-size="14" fill="#c4b5fd">Wi-Fi</text>
    <g transform="translate(750 184)">
      <rect x="0" y="0" width="120" height="72" rx="12" fill="#1d1d3a" stroke="#a78bfa" stroke-width="2"/>
      <text x="60" y="44" text-anchor="middle" font-size="18" font-weight="700">Relay</text>
    </g>

    <!-- to the console and the phone -->
    <path d="M870 204 C 920 190, 930 140, 968 132" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M870 236 C 920 250, 930 300, 968 308" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(974 92)">
      <rect x="0" y="0" width="190" height="80" rx="12" fill="#1d1d3a" stroke="#5b5b85" stroke-width="2"/>
      <text x="16" y="32" font-size="15" font-weight="600">Technician console</text>
      <rect x="16" y="44" width="158" height="24" rx="8" fill="#16a34a"/>
      <text x="95" y="61" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Rig, step 4: ✓ correct</text>
    </g>
    <g transform="translate(974 262)">
      <rect x="0" y="0" width="190" height="96" rx="12" fill="#1d1d3a" stroke="#5b5b85" stroke-width="2"/>
      <text x="16" y="32" font-size="15" font-weight="600">Phone, step card</text>
      <text x="16" y="58" font-size="13" fill="#c4b5fd">Slide the same SSD back in</text>
      <text x="16" y="82" font-size="15" font-weight="700" fill="#4ade80">✓ checked</text>
    </g>
  </g>
</svg>
